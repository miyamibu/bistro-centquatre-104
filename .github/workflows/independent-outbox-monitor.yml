name: Independent outbox monitor
on:
  schedule:
    - cron: "2-59/5 * * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: independent-outbox-monitor
  cancel-in-progress: false
jobs:
  monitor:
    if: ${{ vars.OUTBOX_MONITOR_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      PRODUCTION_BASE_URL: ${{ secrets.PRODUCTION_BASE_URL }}
      OUTBOX_MONITOR_EVALUATE_TOKEN: ${{ secrets.OUTBOX_MONITOR_EVALUATE_TOKEN }}
    steps:
      - name: Evaluate independently and record sanitized observation
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json, os, re, urllib.error, urllib.parse, urllib.request
          allowed = {'FIRST_HEARTBEAT_MISSING', 'HEARTBEAT_MISSING', 'HEARTBEAT_STALE', 'WORKER_UNHEALTHY', 'LANE_STORAGE_FAILED', 'OUTCOME_UNKNOWN', 'RECONCILE_REQUIRED', 'DEAD_LETTER', 'BACKLOG_OVERDUE', 'UNSAFE_TRANSITION'}
          delivery_codes = {'CONFIGURATION_INVALID', 'CONFIGURATION_DRIFT', 'CLAIM_IN_FLIGHT', 'RETRY_COOLDOWN', 'PROVIDER_NETWORK_OR_TIMEOUT', 'PROVIDER_HTTP_REJECTED', 'PROVIDER_RESPONSE_INVALID', 'RETRY_WINDOW_EXPIRED', 'ATTEMPT_CAPACITY', 'HISTORY_CAPACITY', 'MORE_EVENTS_PENDING', 'STORAGE_UNVERIFIED', 'PROVIDER_RECEIPT_CONFLICT', 'MONITOR_DISABLED'}
          def validate_result(result):
              from datetime import datetime
              if not isinstance(result, dict): raise ValueError('result')
              reasons, pending, sequence = result.get('reasons'), result.get('pendingOwnerAcknowledgements'), result.get('sequence')
              events, received, healthy, readiness = result.get('pendingEvents'), result.get('heartbeatReceived'), result.get('healthy'), result.get('readiness')
              if result.get('ok') is not True or (healthy is not None and type(healthy) is not bool) or not isinstance(reasons, list) or len(reasons) > len(allowed) or any(type(r) is not str or r not in allowed for r in reasons) or len(set(reasons)) != len(reasons) or type(pending) is not int or not 0 <= pending <= 64 or type(sequence) is not int or not 0 <= sequence <= 1000000000 or type(received) is not bool or healthy != (None if not received and not reasons else len(reasons) == 0) or readiness != ('WAITING_FOR_FIRST_HEARTBEAT' if healthy is None else 'HEALTHY' if healthy else 'UNHEALTHY'):
                  raise ValueError('health')
              if not isinstance(events, list) or len(events) != pending or any(not isinstance(e, dict) or set(e) != {'sequence', 'reason', 'kind'} or type(e['sequence']) is not int or not 1 <= e['sequence'] <= sequence or e['reason'] not in allowed or e['kind'] not in ('alert', 'recovery') for e in events) or len({e['sequence'] for e in events}) != len(events):
                  raise ValueError('events')
              # Delivery is observed after the health commit; concurrent heartbeat events may advance
              # its accepted cursor beyond this response's earlier health/event snapshot sequence.
              d = result.get('notificationDelivery')
              if not isinstance(d, dict) or set(d) != {'status', 'throughSequence', 'pendingCount', 'batchId', 'providerAcceptedAt', 'code', 'inboxReceipt', 'ownerAcknowledgement'} or d['status'] not in {'IDLE', 'ACCEPTED', 'PENDING', 'SENDING', 'UNKNOWN', 'UNRESOLVED', 'NOT_CONFIGURED'} or type(d['throughSequence']) is not int or not 0 <= d['throughSequence'] <= 1000000000 or type(d['pendingCount']) is not int or not 0 <= d['pendingCount'] <= 64 or not (d['batchId'] is None or type(d['batchId']) is str and re.fullmatch('[a-f0-9]{64}', d['batchId'])) or not (d['code'] is None or d['code'] in delivery_codes) or d['inboxReceipt'] != 'UNVERIFIED' or d['ownerAcknowledgement'] != 'SEPARATE':
                  raise ValueError('delivery')
              if d['providerAcceptedAt'] is not None:
                  if type(d['providerAcceptedAt']) is not str or not re.fullmatch(r'\d{4}-\d\d-\d\dT\d\d:\d\d:\d\d\.\d{3}Z', d['providerAcceptedAt']): raise ValueError('receipt time')
                  datetime.strptime(d['providerAcceptedAt'], '%Y-%m-%dT%H:%M:%S.%fZ')
              if d['status'] == 'IDLE' and (d['pendingCount'] or d['throughSequence'] or d['batchId'] is not None or d['providerAcceptedAt'] is not None or d['code'] is not None): raise ValueError('idle')
              if d['status'] == 'ACCEPTED' and (d['pendingCount'] or d['throughSequence'] < 1 or d['batchId'] is None or d['providerAcceptedAt'] is None or d['code'] is not None): raise ValueError('accepted')
              if d['status'] in {'SENDING', 'UNKNOWN'} and (d['pendingCount'] < 1 or d['batchId'] is None or d['providerAcceptedAt'] is not None): raise ValueError('inflight')
              return result
          def delivery_failed(result):
              d = result['notificationDelivery']
              return d['status'] not in {'IDLE', 'ACCEPTED'} or d['pendingCount'] != 0
          base = os.environ.get('PRODUCTION_BASE_URL', '').rstrip('/')
          target = urllib.parse.urlsplit(base)
          secret = os.environ.get('OUTBOX_MONITOR_EVALUATE_TOKEN', '')
          if base != 'https://bistro-centquatre-104.netlify.app' or target.hostname != 'bistro-centquatre-104.netlify.app' or target.port is not None or target.scheme != 'https' or not target.hostname or target.username or target.password or target.query or target.fragment or target.path or not re.fullmatch('[a-fA-F0-9]{64}', secret):
              raise SystemExit('MONITOR_CONFIGURATION_INVALID')
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, *args, **kwargs): return None
          request = urllib.request.Request(base + '/api/internal/outbox-monitor/evaluate', method='POST', data=b'', headers={'Authorization': 'Bearer ' + secret})
          try:
              with urllib.request.build_opener(NoRedirect).open(request, timeout=45) as response:
                  body = response.read(8193)
                  if len(body) > 8192: raise ValueError('oversize')
                  result = validate_result(json.loads(body))
              d = result['notificationDelivery']
              summary = 'readiness=' + result['readiness'] + '; heartbeatReceived=' + str(result['heartbeatReceived']) + '; healthy=' + str(result['healthy']) + '; reasons=' + ','.join(result['reasons']) + '; pendingOwnerAcknowledgements=' + str(result['pendingOwnerAcknowledgements']) + '; sequence=' + str(result['sequence']) + '; notificationDelivery=' + d['status'] + '; notificationThroughSequence=' + str(d['throughSequence']) + '; pendingNotifications=' + str(d['pendingCount']) + '; inboxReceipt=UNVERIFIED' + ''.join('\n- event=' + str(e['sequence']) + '; reason=' + e['reason'] + '; kind=' + e['kind'] for e in result['pendingEvents'])
          except Exception:
              summary = 'MONITOR_UNREACHABLE_OR_INVALID; notificationDelivery=UNRESOLVED'
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as output: output.write(summary + '\n')
              raise SystemExit(summary)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as output: output.write(summary + '\n')
          print(summary)
          # Keep unhealthy queues and pending human ack explicit, but do not manufacture repeated
          # native failure emails once their operational events have a durable provider acceptance.
          # Failure remains the independent native fallback for Netlify outage/invalid/delivery unresolved.
          if delivery_failed(result): raise SystemExit(1)
          PY
