name: Security Checks

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  security-checks:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bistro_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d bistro_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/bistro_test?schema=public
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/bistro_test?schema=public
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/bistro_test?schema=public
      ALLOW_DESTRUCTIVE_TEST_DB: "1"
      BASE_URL: http://localhost:3000
      ADMIN_BASIC_USER: admin
      ADMIN_BASIC_PASS: pass
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: test-anon-key
      SUPABASE_SERVICE_ROLE_KEY: test-service-role-key
      CRON_SECRET: test-cron-secret
      BACKUP_EXPORT_SECRET: test-backup-export-secret
      PRIVATE_BLOCK_ACCESS_CODE: test-private-block-code
      BANK_ACCOUNT_HISTORY_ENCRYPTION_KEY: ci-placeholder-bank-history-key
      NODE_ENV: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply Prisma migrations
        run: npx prisma migrate deploy

      - name: Run lint (if present)
        run: npm run --if-present lint

      - name: Run typecheck (if present)
        run: npm run --if-present typecheck

      - name: Run tests (if present)
        run: npm run --if-present test

      - name: Run env security check
        run: npm run security:env

      - name: Run destructive reservation security check
        run: npm run security:destructive-reservations
