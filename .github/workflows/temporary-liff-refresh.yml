name: Temporary LIFF-only dependency update
on:
  push:
    branches:
      - security/liff-sdk-2.31.2-20261109

permissions:
  contents: write

jobs:
  refresh-liff-lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Use project's npm version
        run: npm install --global npm@11.11.0
      - name: Resolve LIFF and transplant only LIFF package entries
        shell: bash
        run: |
          cp package-lock.json /tmp/bistro-package-lock-before.json
          cp package.json /tmp/bistro-package-before.json
          npm install @line/liff@2.31.2 --save-exact --package-lock-only --ignore-scripts --no-audit --no-fund
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const load = (p) => JSON.parse(fs.readFileSync(p, 'utf8'));
          const originalManifest = load('/tmp/bistro-package-before.json');
          const newManifest = load('package.json');
          const oldSpec = originalManifest.dependencies['@line/liff'];
          const newSpec = newManifest.dependencies['@line/liff'];
          delete originalManifest.dependencies['@line/liff'];
          delete newManifest.dependencies['@line/liff'];
          if (JSON.stringify(originalManifest) !== JSON.stringify(newManifest)) throw Error('Unexpected package.json change');
          if (oldSpec !== '^2.28.0' || newSpec !== '2.31.2') throw Error('Unexpected manifest version');
          const originalLock = load('/tmp/bistro-package-lock-before.json');
          const resolvedLock = load('package-lock.json');
          const liffPath = (p) => /^node_modules\/(?:@line\/liff(?:\/|$)|@liff\/)/.test(p);
          const oldEntries = originalLock.packages;
          const newEntries = resolvedLock.packages;
          const changed = [...new Set([...Object.keys(oldEntries), ...Object.keys(newEntries)])]
            .filter((p) => JSON.stringify(oldEntries[p]) !== JSON.stringify(newEntries[p]));
          const unrelated = changed.filter((p) => p !== '' && !liffPath(p));
          console.log('npm refreshed ' + changed.length + ' entries; preserving ' + unrelated.length + ' unrelated lockfile entries unchanged');
          for (const p of new Set([...Object.keys(oldEntries), ...Object.keys(newEntries)])) {
            if (!liffPath(p)) continue;
            if (newEntries[p] === undefined) delete oldEntries[p];
            else oldEntries[p] = newEntries[p];
          }
          oldEntries[''].dependencies['@line/liff'] = '2.31.2';
          if (oldEntries['node_modules/@line/liff']?.version !== '2.31.2') throw Error('Unexpected installed LIFF version');
          fs.writeFileSync('package-lock.json', JSON.stringify(originalLock, null, 2) + '\n');
          NODE
          npm ci --ignore-scripts --no-audit --no-fund
          npm ls @line/liff --depth=0
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const orig = JSON.parse(fs.readFileSync('/tmp/bistro-package-lock-before.json', 'utf8'));
          const now = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          if (now.packages['node_modules/@line/liff']?.version !== '2.31.2') throw Error('LIFF SDK not upgraded');
          for (const p of new Set([...Object.keys(orig.packages), ...Object.keys(now.packages)])) {
            if (p === '' || /^node_modules\/(?:@line\/liff(?:\/|$)|@liff\/)/.test(p)) continue;
            if (JSON.stringify(orig.packages[p]) !== JSON.stringify(now.packages[p])) throw Error('Unexpected unrelated lockfile change: '+p);
          }
          if (now.packages[''].dependencies['@line/liff'] !== '2.31.2') throw Error('Invalid lockfile root');
          console.log('PASS: Only LIFF dependency entries changed and npm ci succeeded');
          NODE
      - name: Commit LIFF-only update to security branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- package.json package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "fix(security): upgrade LIFF SDK to 2.31.2"
            git push origin HEAD:security/liff-sdk-2.31.2-20261109
          fi
